<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Surprise <3</title>
  <style>
    :root {
      --bg-color: #ffe6eb;
      --card-bg: #ffffff;
      --primary: #ff4d6d;
      --primary-hover: #ff758f;
      --text-color: #590d22;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.2);
      text-align: center;
      box-sizing: border-box;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1, h2 {
      color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s ease;
      width: 100%;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .option-btn {
      background-color: #fff0f3;
      color: var(--text-color);
      border: 2px solid var(--primary);
      margin: 8px 0;
      text-align: left;
    }

    .option-btn:hover {
      background-color: var(--primary);
      color: white;
    }

    .progress-bar-container {
      width: 100%;
      background-color: #ffccd5;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }

    .progress-bar {
      height: 20px;
      width: 0%;
      background-color: var(--primary);
      transition: width 0.1s linear;
    }

    .gift-box {
      font-size: 80px;
      cursor: pointer;
      animation: pulse 1.5s infinite;
      user-select: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .letter {
      background-color: #fff0f3;
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid var(--primary);
      text-align: left;
      line-height: 1.6;
      font-size: 16px;
      min-height: 120px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- SCREEN 1: START SCREEN -->
    <div id="screen-start" class="screen active">
      <h1>❤️ A Virtual Surprise ❤️</h1>
      <p>I built something special just for you!</p>
      <button onclick="nextScreen('screen-quiz')">Start Journey</button>
    </div>

    <!-- SCREEN 2: QUIZ -->
    <div id="screen-quiz" class="screen">
      <h2>Level 1: Quick Quiz</h2>
      <p id="quiz-question">Question goes here...</p>
      <div id="quiz-options"></div>
    </div>

    <!-- SCREEN 3: LOVE METER -->
    <div id="screen-meter" class="screen">
      <h2>Level 2: Love Meter</h2>
      <p>Analyzing love energy compatibility...</p>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="meter-status">0%</p>
      <button id="meter-next-btn" style="display: none;" onclick="nextScreen('screen-gift')">Unwrap Gift 🎁</button>
    </div>

    <!-- SCREEN 4: GIFT BOX -->
    <div id="screen-gift" class="screen">
      <h2>You've Unlocked a Gift!</h2>
      <p>Tap the gift box to open your message:</p>
      <div class="gift-box" onclick="openGift()">🎁</div>
    </div>

    <!-- SCREEN 5: FINAL LETTER -->
    <div id="screen-letter" class="screen">
      <h2>💌 For You</h2>
      <div class="letter">
        <p id="typewriter-text"></p>
      </div>
    </div>

  </div>

  <script>
    const quizData = [
      {
        question: "1. Who is the luckiest person in the world?",
        options: ["You", "Definitely You", "Still You"],
        correct: 0
      },
      {
        question: "2. What is my favorite thing about you?",
        options: ["Your smile", "Your sense of humor", "Everything!"],
        correct: 2
      },
      {
        question: "3. How much do I love you?",
        options: ["To the moon and back", "More than code", "Infinite x 1000"],
        correct: 2
      }
    ];

    let currentQuestion = 0;

    function showQuestion() {
      const q = quizData[currentQuestion];
      document.getElementById('quiz-question').innerText = q.question;
      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer();
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer() {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        showQuestion();
      } else {
        nextScreen('screen-meter');
        startLoveMeter();
      }
    }

    function nextScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-quiz') {
        showQuestion();
      }
    }

    function startLoveMeter() {
      let percent = 0;
      const progressBar = document.getElementById('progress-bar');
      const statusText = document.getElementById('meter-status');
      
      const interval = setInterval(() => {
        percent += 2;
        progressBar.style.width = percent + '%';
        statusText.innerText = percent + '%';

        if (percent >= 100) {
          clearInterval(interval);
          statusText.innerText = 'OVERFLOW ERROR: Love level exceeds 1000000%! 💕';
          document.getElementById('meter-next-btn').style.display = 'block';
        }
      }, 50);
    }

    function openGift() {
      nextScreen('screen-letter');
      startTypewriter();
    }

    const personalMessage = "Dear Handsome,\n\nI created this webpage to let you know how much you mean to me! Thank you for always bringing so much joy, love, and laughter into my life.\n\nYou are my favorite person, and I love you endlessly! ❤️";

    function startTypewriter() {
      let i = 0;
      const target = document.getElementById('typewriter-text');
      target.innerText = "";
      
      function type() {
        if (i < personalMessage.length) {
          target.innerText += personalMessage.charAt(i);
          i++;
          setTimeout(type, 40);
        }
      }
      type();
    }
  </script>
</body>
</html>
